name: Build & Publish Android APK to GitHub Releases

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize package.json for public npm registry and build web bundle
        run: |
          python3 scripts/build_android_apk.py
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies = {
              "lucide-react": "^0.475.0",
              "react": "^19.0.0",
              "react-dom": "^19.0.0"
            };
            pkg.devDependencies = {
              "@tailwindcss/vite": "^4.0.9",
              "@types/node": "^22.10.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "@vitejs/plugin-react": "^4.3.4",
              "tailwindcss": "^4.0.9",
              "typescript": "^5.7.3",
              "vite": "^6.2.0",
              "vite-plugin-pwa": "^0.21.1"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm install --legacy-peer-deps
          npx vite build
          python3 scripts/build_windows_exe.py
          cd dist && zip -r ../Win11-Update-Notifier-Web-Bundle.zip . && cd ..

      - name: Set up JDK 17 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android project and compile signed APK using pre-installed Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi
          python3 scripts/build_android_apk.py
          cd android_build
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Win11-Update-Notifier-Android.apk

      - name: Publish Windows EXE, Android APK & Web Bundle to GitHub Releases (Win11 Repo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0"
          RELEASE_TITLE="Win11 Update Notifier — Windows EXE, Android APK & Discord Suite ($TAG_NAME)"
          NOTES="### 💻📱 Download Win11 Update Notifier (Windows .EXE & Android .APK)\n\n- **Windows 11 Standalone Desktop App:** Download **\`Win11-Update-Notifier-Windows.exe\`** below and double-click to launch the updated WUB Safe-Window & Summary Tab desktop app.\n- **Android Standalone App:** Download **\`Win11-Update-Notifier-Android.apk\`** on your Android phone.\n- **Features Included:**\n  1. New **Summary Tab** with plain-English WUB window analysis & version-by-version KB rollup table\n  2. Live Multi-Table Microsoft Release Health Parser (26H2, 25H2, 24H2, 26H1, 23H2)\n  3. Automatic Superseding Detection (e.g., Oct 28 KB5127936 superseded by Nov 10 KB5132061)\n  4. Priority-based **Discord @everyone Webhook** & Phone Notifications"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              Win11-Update-Notifier-Windows.exe \
              Win11-Update-Notifier-Android.apk \
              Win11-Update-Notifier-Web-Bundle.zip \
              --clobber
          else
            gh release create "$TAG_NAME" \
              Win11-Update-Notifier-Windows.exe \
              Win11-Update-Notifier-Android.apk \
              Win11-Update-Notifier-Web-Bundle.zip \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES"
          fi
